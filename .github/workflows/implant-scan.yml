name: implant-scan

# Fails the build if the EtherHiding implant or a VS Code auto-run kit reappears.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 1 * *'   # monthly backstop; the push trigger is the real net
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for implant indicators
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          hit() { echo "::error file=$2::$1 -> $2"; fail=1; }

          # 1. payload signatures (C2 beacon header, C2 paths, attacker address)
          while IFS= read -r f; do hit "implant signature" "$f"; done < <(
            grep -rlE 'Sec-V|0x/cls|0x/ls|6f0121063e' . \
              --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null)

          # 2. VS Code task that runs on folder open
          while IFS= read -r f; do hit "auto-run task (runOn folderOpen)" "$f"; done < <(
            grep -rl 'folderOpen' . --include='*.json' \
              --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null)

          # 3. the setting that suppresses VS Code's confirmation prompt
          while IFS= read -r f; do hit "task.allowAutomaticTasks enabled" "$f"; done < <(
            grep -rlE '"task\.allowAutomaticTasks"\s*:\s*(true|"on")' . \
              --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null)

          # 4. the dropper's filename (never a real font: FontAwesome ships fa-solid-900)
          while IFS= read -r f; do hit "known dropper filename" "$f"; done < <(
            find . -name 'fa-solid-400.woff2' -not -path './.git/*' 2>/dev/null)

          # 5. any .woff2 that is not actually a font (magic must be wOF2)
          while IFS= read -r f; do
            [ "$(head -c4 "$f" | xxd -p)" = "774f4632" ] || hit "woff2 with wrong magic bytes" "$f"
          done < <(find . -name '*.woff2' -not -path './.git/*' -size +0 2>/dev/null)

          # 6. attacker tooling names left in .gitignore
          while IFS= read -r f; do hit "attacker .gitignore litter" "$f"; done < <(
            grep -rlE 'temp_auto_push|temp_interactive_push|branch_structure\.json' . \
              --include='.gitignore' --exclude-dir=.git 2>/dev/null)

          if [ "$fail" -ne 0 ]; then
            echo "IMPLANT INDICATORS FOUND — do not merge, do not run builds from this tree."
            exit 1
          fi
          echo "clean: no implant indicators found"
